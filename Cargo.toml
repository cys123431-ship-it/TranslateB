[package]
name = "translateb"
version = "0.1.2"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
pdfium-render = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
rfd = "0.17"
regex = "1"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
